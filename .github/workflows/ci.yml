name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/finance_receipt_collector_test_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: finance_receipt_collector_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finance_receipt_collector_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check PostgreSQL connectivity
        run: >-
          node --input-type=module -e
          "import pg from 'pg'; const pool = new pg.Pool({connectionString: process.env.TEST_DATABASE_URL});
          const result = await pool.query('SELECT current_database() AS name');
          if (result.rows[0].name !== 'finance_receipt_collector_test_ci') throw new Error('Unexpected test database');
          await pool.end();"

      - name: Check Node.js syntax
        run: npm run check

      - name: PostgreSQL integration gate
        run: npm run test:integration

      - name: Prepare full-suite PostgreSQL fixture
        run: node scripts/prepare-postgres-integration.mjs

      - name: Full test suite
        run: npm test

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android unit tests and debug build
        working-directory: android/buhguy-bank-collector
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Verify debug APK
        shell: bash
        run: test -f android/buhguy-bank-collector/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: buhguy-bank-collector-debug
          path: android/buhguy-bank-collector/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  android-signed:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct signing keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.BUHGUY_ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/buhguy-bank-collector.jks"
          chmod 600 "$RUNNER_TEMP/buhguy-bank-collector.jks"

      - name: Build signed APK
        working-directory: android/buhguy-bank-collector
        env:
          BUHGUY_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/buhguy-bank-collector.jks
          BUHGUY_ANDROID_STORE_PASSWORD: ${{ secrets.BUHGUY_ANDROID_STORE_PASSWORD }}
          BUHGUY_ANDROID_KEY_ALIAS: ${{ secrets.BUHGUY_ANDROID_KEY_ALIAS }}
          BUHGUY_ANDROID_KEY_PASSWORD: ${{ secrets.BUHGUY_ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          apk=android/buhguy-bank-collector/app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          apksigner verify --print-certs "$apk"
          sha256sum "$apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: buhguy-bank-collector-signed
          path: android/buhguy-bank-collector/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/buhguy-bank-collector.jks"
